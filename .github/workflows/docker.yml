name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-smoke:
    # PRs and branch pushes: build one arch, scan, and smoke-test the container.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: obsidian-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: obsidian-mcp:smoke
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          VAULT="$(mktemp -d)"
          mkdir -p "$VAULT/.obsidian"
          echo '# hello' > "$VAULT/Hello.md"
          chmod -R 777 "$VAULT"   # container appuser is uid 1001; runner uid may differ
          TOKEN="$(openssl rand -hex 32)"
          docker run -d --name mcp-smoke \
            -e MCP_PUBLIC_URL=http://127.0.0.1:3000 \
            -e MCP_AUTH_TOKEN="$TOKEN" \
            -v "$VAULT:/vault" \
            -p 127.0.0.1:3000:3000 \
            obsidian-mcp:smoke || {
              docker logs mcp-smoke; exit 1;
            }
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz && break || sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp \
            -H 'content-type: application/json' -d '{}')
          test "$code" = "401"
          curl -fsS http://127.0.0.1:3000/readyz | grep -q '"readable":true'
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-03","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            http://127.0.0.1:3000/mcp | grep -q serverInfo
          docker rm -f mcp-smoke

  release:
    # Tags only: multi-arch image with provenance + SBOM pushed to GHCR.
    # Note: the image namespace derives from github.repository. If this fork
    # has not renamed package.json `repository`/`author` (still upstream
    # StevenStavrakis), decide the GHCR namespace deliberately before tagging.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
